interface:
  display_name: "项目定义"
  short_description: "根据已确认目的比较候选项目，定义整体框架、组成、关系、边界和特点"
  default_prompt: "使用 $project-definition，先读取我项目中的 why/project-purpose.md，检查目的入口；先和我逐项对齐需求，一次只处理一个部分、每轮只问一个问题，未完成对齐前不要输出完整候选比较或框架草稿；对齐后也一次只展示一个待审查草稿部分，经过两次确认后再形成 what/project-definition.md；不要搜索资料、拆实施任务或直接实现代码。"
