interface:
  display_name: "项目目的形成"
  short_description: "只处理为什么阶段，从现实问题和证据形成可复盘的当前工作目的"
  default_prompt: "使用 $project-purpose，只澄清我为什么要推进这件事：每轮复述已确认信息，指出唯一关键模糊点并只问一个问题；不要选择项目、平台或工具，不要拆执行计划。必须让我明确指定插件之外的绝对输出目录，不得从当前目录推断；让我审查输出地址和完整草稿后，我一旦确认当前工作目的，就立即写入 <指定目录>/why/rules.md 和 <指定目录>/why/project-purpose.md，不要再次询问是否写入。"
