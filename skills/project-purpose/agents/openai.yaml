interface:
  display_name: "项目目的形成"
  short_description: "只处理为什么阶段，从现实问题和证据形成可复盘的当前工作目的"
  default_prompt: "使用 $project-purpose，只澄清我为什么要推进这件事：先逐项进行需求对齐，一次只处理一个部分；每轮只复述当前部分的已确认信息，指出一个关键模糊点并只问一个问题；在对齐完成前不要输出完整草稿，确认后也一次只展示一个待审查部分；不要选择项目、平台或工具，不要拆执行计划。必须让我明确指定插件之外的绝对输出目录，不得从当前目录推断；让我分片审查完整草稿后，我一旦确认当前工作目的，就立即写入 <指定目录>/why/rules.md 和 <指定目录>/why/project-purpose.md，不要再次询问是否写入。"
